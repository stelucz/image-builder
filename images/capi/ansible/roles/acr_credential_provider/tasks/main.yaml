---
- name: Ensure acr_credential_provider is not already installed
  ansible.builtin.stat:
    path: "{{ acr_credential_provider_install_dir }}/{{ acr_credential_provider_binary_filename }}"
  register: acr_credential_provider_binary

- name: Install acr Credential Provider binary
  when: not acr_credential_provider_binary.stat.exists
  block:
    - name: Ensure bin directory exists
      ansible.builtin.file:
        path: "{{ acr_credential_provider_install_dir }}"
        state: directory
        mode: "0755"

    - name: Download acr_credential_provider binary
      ansible.builtin.get_url:
        url: "{{ acr_credential_provider_base_url }}/{{ acr_credential_provider_version }}/azure-acr-credential-provider-{{ acr_credential_provider_os }}-{{ acr_credential_provider_arch }}"
        dest: "{{ acr_credential_provider_install_dir }}/{{ acr_credential_provider_binary_filename }}"
        mode: "0755"

- name: Create the CredentialProviderConfig for the acr Credential Provider
  block:
    - name: Ensure config directory exists
      ansible.builtin.file:
        path: /var/usr/acr-credential-provider
        state: directory
        mode: "0755"

    - name: Create CredentialProviderConfig
      ansible.builtin.template:
        src: var/usr/acr-credential-provider/acr-credential-provider-config
        dest: /var/usr/acr-credential-provider/acr-credential-provider-config
        mode: "0644"

- name: Update kubelet args to include credential provider flags
  block:
    - name: Ensure kubelet config exists
      ansible.builtin.stat:
        path: "{{ '/etc/default/kubelet' if ansible_os_family == 'Debian' else '/etc/sysconfig/kubelet' }}"
      register: kubelet_config
      failed_when: not kubelet_config.stat.exists

    - name: Add credential provider flags
      when: kubelet_config.stat.exists
      ansible.builtin.shell: |
        set -e -o pipefail
        sed -Ei 's|^(KUBELET_EXTRA_ARGS.*)|\1 --image-credential-provider-config=/var/usr/acr-credential-provider/acr-credential-provider-config --image-credential-provider-bin-dir={{ acr_credential_provider_install_dir }}|' {{ '/etc/default/kubelet' if ansible_os_family == 'Debian' else '/etc/sysconfig/kubelet' }}
      args:
        executable: /bin/bash
